<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simon - the memory tones game</title>
<style>
  :root { --bg:#121316; --panel:#1c1e24; --line:#2e323b; --text:#eef1f5; --dim:#939aa6; --accent:#f2c94c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 14px 40px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; }
  .wrap { position:relative; width:320px; height:320px; }
  .pad { position:absolute; width:150px; height:150px; cursor:pointer; opacity:.55; transition:opacity .12s; }
  .pad.lit { opacity:1; }
  .pad.playing { cursor:default; }
  #p0 { top:0; left:0; background:#2fbf71; border-radius:150px 12px 12px 12px; }
  #p1 { top:0; right:0; background:#e05252; border-radius:12px 150px 12px 12px; }
  #p2 { bottom:0; left:0; background:#f2c94c; border-radius:12px 12px 12px 150px; }
  #p3 { bottom:0; right:0; background:#4c8bf2; border-radius:12px 12px 150px 12px; }
  #center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:130px; height:130px; border-radius:50%; background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2; }
  #level { font-size:30px; font-weight:800; }
  #level-label { font-size:11px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
  .row { display:flex; gap:10px; margin-top:22px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button { background:var(--accent); color:#121316; border:none; border-radius:9px; padding:10px 22px; font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { background:#3a3f47; color:#7a828d; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  button.ghost.on { color:var(--text); border-color:var(--text); }
  #status { margin-top:14px; min-height:22px; font-size:15px; text-align:center; }
  #best { margin-top:4px; color:var(--dim); font-size:13px; }
  .foot { margin-top:18px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>Simon</h1>
<div class="sub">watch the tones, play them back - one more pad every level</div>

<div class="wrap">
  <div class="pad" id="p0" data-pad="0"></div>
  <div class="pad" id="p1" data-pad="1"></div>
  <div class="pad" id="p2" data-pad="2"></div>
  <div class="pad" id="p3" data-pad="3"></div>
  <div id="center">
    <div id="level">-</div>
    <div id="level-label">level</div>
  </div>
</div>

<div class="row">
  <button id="start">Start</button>
  <button class="ghost" id="strict">Strict mode: off</button>
</div>
<div id="status">Press start.</div>
<div id="best"></div>

<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var pads = [0,1,2,3].map(function (i) { return document.getElementById('p' + i); });
  var levelEl = document.getElementById('level');
  var statusEl = document.getElementById('status');
  var bestEl = document.getElementById('best');
  var startBtn = document.getElementById('start');
  var strictBtn = document.getElementById('strict');

  var seq = [], input = [], phase = 'idle', strict = false, audioCtx = null;
  // phases: idle | showing | input | over

  function loadBest() { try { return parseInt(localStorage.getItem('simon-best')) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('simon-best', String(v)); } catch (e) {} }

  function renderBest() { bestEl.textContent = 'best level: ' + loadBest(); }

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
  }

  function tone(pad, dur) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = Simon.TONES[pad];
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur / 1000);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur / 1000 + 0.05);
  }

  function flash(pad, dur) {
    pads[pad].classList.add('lit');
    tone(pad, dur);
    setTimeout(function () { pads[pad].classList.remove('lit'); }, dur);
  }

  function setPadsInteractive(on) {
    pads.forEach(function (p) { p.classList.toggle('playing', !on); });
  }

  function playSeq() {
    phase = 'showing';
    setPadsInteractive(false);
    statusEl.textContent = 'Watch...';
    var tempo = Simon.tempoFor(seq.length);
    var i = 0;
    function step() {
      if (i < seq.length) {
        flash(seq[i], tempo * 0.7);
        i++;
        setTimeout(step, tempo);
      } else {
        phase = 'input';
        input = [];
        setPadsInteractive(true);
        statusEl.textContent = 'Your turn - ' + seq.length + ' pads';
      }
    }
    setTimeout(step, 600);
  }

  function nextLevel() {
    seq = Simon.extend(seq, Math.random);
    levelEl.textContent = seq.length;
    playSeq();
  }

  function gameOver() {
    phase = 'over';
    setPadsInteractive(false);
    var lvl = seq.length;
    if (lvl > loadBest()) saveBest(lvl);
    renderBest();
    statusEl.textContent = 'Wrong pad - game over at level ' + lvl + '.';
    levelEl.textContent = lvl;
    startBtn.textContent = 'Play again';
  }

  function padPress(pad) {
    if (phase !== 'input') return;
    flash(pad, 220);
    input.push(pad);
    var verdict = Simon.judge(seq, input);
    if (verdict === 'wrong') {
      if (strict) { gameOver(); return; }
      statusEl.textContent = 'Nope - watch it again.';
      input = [];
      phase = 'showing';
      setPadsInteractive(false);
      setTimeout(playSeq, 800);
    } else if (verdict === 'complete') {
      if (seq.length > loadBest()) { saveBest(seq.length); renderBest(); }
      statusEl.textContent = 'Nice. Level up...';
      phase = 'showing';
      setPadsInteractive(false);
      setTimeout(nextLevel, 900);
    } else {
      statusEl.textContent = 'Your turn - ' + (seq.length - input.length) + ' to go';
    }
  }

  pads.forEach(function (p, i) {
    p.addEventListener('click', function () { padPress(i); });
  });

  startBtn.addEventListener('click', function () {
    ensureAudio();
    seq = []; input = []; phase = 'idle';
    startBtn.textContent = 'Restart';
    nextLevel();
  });

  strictBtn.addEventListener('click', function () {
    strict = !strict;
    strictBtn.textContent = 'Strict mode: ' + (strict ? 'on' : 'off');
    strictBtn.classList.toggle('on', strict);
  });

  // test hook
  window.__simon = {
    state: function () { return { seq: seq.slice(), input: input.slice(), phase: phase, strict: strict }; },
    setSeq: function (s) { seq = s.slice(); levelEl.textContent = seq.length; },
    setPhase: function (p) { phase = p; if (p === 'input') { input = []; setPadsInteractive(true); } }
  };

  renderBest();
})();
</script>
</body>
</html>
